<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of the RAG platform</title>
  <desc id="desc">React frontend connected to a FastAPI backend, MongoDB, ChromaDB, Redis and OpenAI or Gemini providers.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#6366f1"/></linearGradient><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0 0 8 4 0 8Z" fill="#67e8f9"/></marker></defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><text x="60" y="65" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Private-by-design RAG platform</text><text x="60" y="94" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Multi-user document intelligence with OpenAI/Gemini provider selection</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="190" width="180" height="95" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="145" y="230" fill="#e0f2fe" font-size="19" font-weight="700">React + Tailwind</text><text x="145" y="255" fill="#94a3b8" font-size="13">User workspace</text><rect x="340" y="160" width="230" height="155" rx="20" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><text x="455" y="205" fill="#eef2ff" font-size="21" font-weight="700">FastAPI</text><text x="455" y="235" fill="#cbd5e1" font-size="14">Auth · RAG · quotas</text><text x="455" y="260" fill="#cbd5e1" font-size="14">typed responses · BYOK</text><text x="455" y="285" fill="#cbd5e1" font-size="14">background processing</text><rect x="700" y="125" width="190" height="90" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="795" y="165" fill="#d1fae5" font-size="19" font-weight="700">MongoDB</text><text x="795" y="190" fill="#94a3b8" font-size="13">Users · history · metadata</text><rect x="700" y="250" width="190" height="90" rx="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="795" y="290" fill="#fef3c7" font-size="19" font-weight="700">ChromaDB</text><text x="795" y="315" fill="#94a3b8" font-size="13">Embeddings · retrieval</text><rect x="700" y="375" width="190" height="90" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="2"/><text x="795" y="415" fill="#fce7f3" font-size="19" font-weight="700">Redis</text><text x="795" y="440" fill="#94a3b8" font-size="13">Rate limiting · runtime</text><rect x="1000" y="190" width="145" height="180" rx="20" fill="url(#accent)"/><text x="1072" y="245" fill="white" font-size="19" font-weight="700">LLM</text><text x="1072" y="280" fill="white" font-size="15">OpenAI</text><text x="1072" y="310" fill="white" font-size="15">or Gemini</text><text x="1072" y="345" fill="#e0f2fe" font-size="12">generation + embeddings</text></g>
  <g stroke="#67e8f9" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M235 238h100"/><path d="M570 205h125"/><path d="M570 250h125"/><path d="M570 285h125"/><path d="M890 170h100"/><path d="M890 295h100"/><path d="M890 420h100"/></g>
</svg>
