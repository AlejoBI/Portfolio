<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">RAG document and question flow</title>
  <desc id="desc">Documents are validated, chunked and embedded; questions retrieve sources before generation.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path d="M0 0 8 4 0 8Z" fill="#a5f3fc"/></marker></defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/><text x="55" y="58" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">How the RAG flow works</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#1e293b" stroke="#67e8f9" stroke-width="2"><rect x="45" y="135" width="155" height="95" rx="16"/><rect x="260" y="135" width="155" height="95" rx="16"/><rect x="475" y="135" width="155" height="95" rx="16"/><rect x="690" y="135" width="155" height="95" rx="16"/><rect x="905" y="135" width="220" height="95" rx="16"/></g><g fill="#ecfeff" font-size="17" font-weight="700"><text x="122" y="174">1. Upload</text><text x="337" y="174">2. Extract</text><text x="552" y="174">3. Embed</text><text x="767" y="174">4. Retrieve</text><text x="1015" y="174">5. Answer + sources</text></g><g fill="#94a3b8" font-size="13"><text x="122" y="201">PDF · DOCX · TXT</text><text x="337" y="201">validate + chunk</text><text x="552" y="201">ChromaDB</text><text x="767" y="201">top relevant fragments</text><text x="1015" y="201">selected LLM</text></g></g><g stroke="#a5f3fc" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M200 182h55"/><path d="M415 182h55"/><path d="M630 182h55"/><path d="M845 182h55"/></g><text x="600" y="310" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Registered users recover documents and history; anonymous sessions expire automatically.</text>
</svg>
